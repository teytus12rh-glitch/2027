# ==============================================================================
# CONFIGURAÇÃO OFICIAL: LEANDRO CORRÊA — TV TCL 55 OLED & XIAOMI MI TV STICK
# ==============================================================================

# Chave gratuita da API do TheMovieDB (TMDB):
# Obtenha gratuitamente em: https://www.themoviedb.org/settings/api
# Se deixar vazio, a tela inicial funciona normalmente (apenas sem os cards de filmes em alta).
tmdb_key=

# Região / País do streaming: Brasil (traz catálogos e títulos disponíveis no Brasil)
tmdb_region=BR

# Coordenadas meteorológicas e pôr do sol de Ourinhos, SP
latitude=-22.9784
longitude=-49.8706

# Nome exibido no cartão de clima
city=Ourinhos

# Ocultar animações/desenhos infantis dos destaques de filmes (false = exibe tudo)
hide_animation=false

# Idioma da interface: Português do Brasil (pt)
language=pt

# Exibir cotações financeiras na tela inicial e no descanso de tela
show_crypto=true

# Moeda padrão: Real Brasileiro (BRL)
currency=BRL

# Unidade de temperatura: Celsius (C)
temperature=C

# Tema visual da tela: auto (adapta dinamicamente do pôr ao nascer do sol)
theme=auto

# Manter Google Assistente ativo (false = assistente e microfone do controle continuam funcionando)
disable_assistant=false

# Protetor de tela OLED / screensaver integrado (true = protege painel OLED da TCL contra burn-in)
screensaver=true

# Serviços de streaming filtrados para o Brasil e catálogo do Leandro:
# Remove serviços estrangeiros inexistentes no Brasil, mantendo:
# Netflix, Prime Video, Disney+, Max (HBO), Globoplay, Apple TV+, Crunchyroll, Stremio e Plex
hide_services=hulu,peacock,hotstar,okko,oneplay,now,kinopoisk,premier,amediateka,wink,ard,zdf,arte,joyn,rtl,wow,magenta

# Aplicativos a ocultar do shelf (deixe vazio para gerenciar direto na TV)
hide_apps=

# Ordem prioritária de aplicativos na prateleira principal:
shelf_apps=youtube,netflix,prime,disney,max,globoplay,stremio,plex,spotify

# Chave opcional do Watchmode para abrir direto na página do título
watchmode_key=

# Abrir gaveta de entradas (HDMI 1 Xbox / HDMI 2 Mi Stick) com prioridade
drawer_first=false

# Integração opcional com servidor Plex local
plex_url=
plex_token=
